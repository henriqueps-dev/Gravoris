<div class="adm">
  <aside class="adm-side">
    <a routerLink="/admin" class="adm-brand" aria-label="Painel Gravoris">
      GRAVORIS
      <small>Painel administrativo</small>
    </a>

    <nav class="adm-nav" aria-label="Painel">
      <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" title="Dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="M4 13h6V4H4v9zm10 7h6V11h-6v9zM4 20h6v-4H4v4zm10-16v4h6V4h-6z" stroke-width="1.5" stroke-linejoin="round" />
        </svg>
        <span>Dashboard</span>
      </a>
      <a routerLink="/admin/veiculos" routerLinkActive="active" title="Veículos e anúncios">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="M3 14l2-5.5A2 2 0 016.9 7h10.2a2 2 0 011.9 1.5L21 14v4a1 1 0 01-1 1h-1.5a1 1 0 01-1-1v-1h-11v1a1 1 0 01-1 1H4a1 1 0 01-1-1v-4z" stroke-width="1.5" stroke-linejoin="round" />
          <path d="M3 14h18M7 16.5h.01M17 16.5h.01" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <span>Veículos</span>
      </a>
      <a routerLink="/admin/usuarios" routerLinkActive="active" title="Usuários">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <circle cx="9" cy="8" r="3.5" stroke-width="1.5" />
          <path d="M2.5 19c0-3.3 2.9-5.5 6.5-5.5s6.5 2.2 6.5 5.5M16 4.8a3.5 3.5 0 010 6.4M18.5 13.8c1.8.8 3 2.6 3 5.2" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <span>Usuários</span>
      </a>
    </nav>

    <div class="adm-side-foot">
      <div class="adm-user">
        <strong>{{ auth.currentUser()?.fullName }}</strong>
        {{ auth.currentUser()?.email }}
      </div>
      <a routerLink="/" title="Ver a loja">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Ver loja</span>
      </a>
      <button type="button" class="adm-logout" (click)="logout()" title="Sair">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="M15 4h4a1 1 0 011 1v14a1 1 0 01-1 1h-4M10 16l-4-4 4-4M6 12h10" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Sair</span>
      </button>
    </div>
  </aside>

  <main class="adm-main">
    <router-outlet />
  </main>
</div>
