# ---------------------------------------------------------------
# Configuração comum a todos os ambientes.
# Credenciais NUNCA ficam aqui: use variáveis de ambiente (veja .env.example).
# Perfis: local (MySQL da máquina, padrão), dev (H2 em memória, usado nos testes), prod (Supabase).
# ---------------------------------------------------------------
spring.application.name=gravoris
spring.profiles.default=local

server.port=${PORT:8080}
# Respeita X-Forwarded-* quando hospedado atrás de proxy/load balancer (Render, Railway, Fly...)
server.forward-headers-strategy=framework

spring.jpa.open-in-view=false

# Upload de imagens de anúncios
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Segurança (JWT) ---
# Segredo HMAC com no mínimo 32 caracteres. Obrigatório em produção.
app.security.jwt-secret=${JWT_SECRET:}
app.security.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:720}
app.security.admin-jwt-expiration-minutes=${ADMIN_JWT_EXPIRATION_MINUTES:120}

# --- CORS: origens do frontend separadas por vírgula ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:4000}

# --- Primeiro administrador (só é usado se ainda não existir nenhum administrador) ---
app.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.admin.bootstrap.name=${ADMIN_BOOTSTRAP_NAME:Administrador}
app.admin.bootstrap.cpf=${ADMIN_BOOTSTRAP_CPF:}

# --- Supabase Storage (imagens dos anúncios). A service_role key fica SÓ no backend. ---
app.supabase.url=${SUPABASE_URL:}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
app.supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:veiculos}

# Popula o catálogo inicial quando a tabela de produtos está vazia
app.seed-catalog=${SEED_CATALOG:true}

# --- Migração única MySQL -> Supabase (veja MysqlParaSupabaseMigrator) ---
app.migration.enabled=${MIGRATION_ENABLED:false}
app.migration.source.url=${MIGRATION_SOURCE_URL:}
app.migration.source.username=${MIGRATION_SOURCE_USER:}
app.migration.source.password=${MIGRATION_SOURCE_PASSWORD:}
