# Perfil "dev": banco H2 em memória (usado pelos testes automatizados; não toca em dados reais).
spring.datasource.url=jdbc:h2:mem:gravoris_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

app.security.jwt-secret=${JWT_SECRET:dev-only-secret-gravoris-troque-em-producao-0123456789}
