# Perfil "prod": Supabase (PostgreSQL). Todos os valores vêm de variáveis de ambiente.
# Use a connection string do "Session pooler" (porta 5432) do Supabase, que funciona em IPv4:
#   jdbc:postgresql://aws-0-<regiao>.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1

# O schema é criado pelo script supabase/migrations; o Hibernate só valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Em produção o catálogo vem da migração dos dados reais, não do seed.
app.seed-catalog=${SEED_CATALOG:false}

# Documentação da API desligada em produção
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

server.error.include-stacktrace=never
server.error.include-message=never
