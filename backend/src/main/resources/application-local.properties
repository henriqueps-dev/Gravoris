# Perfil "local": MySQL instalado na máquina de desenvolvimento (banco legado, preservado).
# Configure MYSQL_PASSWORD no seu ambiente; o valor padrão abaixo vale apenas para a máquina local.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/gravoris_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:12345678}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Segredo de desenvolvimento. Em produção é obrigatório definir JWT_SECRET.
app.security.jwt-secret=${JWT_SECRET:dev-only-secret-gravoris-troque-em-producao-0123456789}
